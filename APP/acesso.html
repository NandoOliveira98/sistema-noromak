<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1F57A5">
  <link rel="icon" href="/favicon.ico?v=11.2" sizes="any">
  <link rel="shortcut icon" href="/favicon.ico?v=11.2">
  <title>Expedição Noromak — Acesso</title>
  <style>
    :root{--blue:#1F57A5;--orange:#F7941D;--ink:#17395f;--muted:#617286}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#eef5fd,#dbe9f8);font-family:"Plus Jakarta Sans",Segoe UI,Arial,sans-serif;color:var(--ink)}
    .shell{width:min(720px,100%);background:#fff;border-radius:20px;box-shadow:0 25px 70px rgba(24,57,95,.20);overflow:hidden;border-top:8px solid var(--orange)}
    .head{padding:30px 34px 20px;text-align:center}
    .head img{max-width:230px;max-height:68px;object-fit:contain}
    h1{margin:12px 0 8px;color:var(--blue);font-size:28px}
    .head p{margin:0;color:var(--muted);line-height:1.55}
    #webAccessPortal{padding:0 34px 34px}
    .access-user{padding:18px;border:1px solid #c9dcf1;background:#eef5fd;border-radius:14px;display:flex;flex-direction:column;gap:4px}
    .access-user span{font-size:12px;color:#65778a}.access-user strong{font-size:22px}.access-user small{font-size:13px;color:#50677d}
    .access-actions{display:grid;gap:10px;margin-top:18px}.access-actions a{display:block;text-align:center;text-decoration:none;border-radius:10px;padding:14px 18px;font-weight:800}.access-actions .primary{background:var(--blue);color:#fff}.access-actions .secondary{background:var(--orange);color:#fff}
    .access-denied{margin-top:18px;padding:16px;border-radius:12px;background:#fff4e7;border:1px solid #f4c88e;color:#754612;line-height:1.5}
    .back-link{display:block;text-align:center;margin-top:18px;color:var(--blue);font-weight:700;text-decoration:none;font-size:13px}
    .note{padding:17px 34px;background:#f8fafc;border-top:1px solid #e2e8ef;color:#6b7784;font-size:12px;line-height:1.5;text-align:center}

    .stock-login{display:grid;gap:9px;padding:2px 0}.stock-login h2{margin:0 0 2px;color:var(--blue);font-size:21px}.stock-login p{margin:0 0 12px;color:var(--muted);font-size:13px;line-height:1.45}.stock-login label{font-size:12px;font-weight:800;color:#365570}.stock-login input{width:100%;padding:13px 14px;border:1px solid #b9c9da;border-radius:9px;font-size:15px;outline:none}.stock-login input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(31,87,165,.12)}.stock-login button,.logout-access{border:0;border-radius:9px;padding:13px 16px;background:var(--blue);color:#fff;font-weight:850;cursor:pointer;margin-top:6px}.stock-login button:disabled{opacity:.65;cursor:wait}.stock-error{min-height:20px;color:#b42318;font-size:12px;font-weight:750}.logout-access{width:100%;background:#fff!important;color:var(--blue)!important;border:1px solid #b9c9da!important}
  </style>
  <script src="/expedicao/web-auth.js"></script>
</head>
<body>
  <main class="shell">
    <section class="head">
      <img src="/nk-logo.svg?v=11.2" alt="Noromak" onerror="this.onerror=null;this.src='/nk-logo.png?v=11.2';">
      <h1>Sistema de Expedição</h1>
      <p>Entre com o usuário do estoque. Administração e Conferência podem ser instaladas como aplicativos separados no Windows.</p>
    </section>
    <section id="webAccessPortal"></section>
    <div class="note">
      <img src="/grupo-noromak.png?v=11.2" alt="Grupo Noromak" style="display:block;max-width:180px;max-height:42px;margin:0 auto 10px;object-fit:contain" onerror="this.style.display='none'">
      O NoromakWeb protege o endereço externo. Para instalar, abra a tela desejada e clique em <b>Instalar Admin</b> ou <b>Instalar Conferência</b>.
    </div>
  </main>
</body>
</html>
