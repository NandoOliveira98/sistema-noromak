<title>Noromak · Anúncios</title>
<!-- V20.23: Plataforma de anúncios, fase 1. Lista das fichas (um produto = uma ficha, com os anúncios de todos os
     canais) e a ficha de cada produto em ?codigo= (abas Ficha do produto · Kits · Anúncios em todos os canais).
     Ver = módulo admin; gravar = só perfil Admin (Supervisor e Consulta não veem os botões de gravar).
     Nada desta tela grava no ML, Shopee, Magalu, TikTok nem no Apollo: só a ficha, o Cadastro de Kits e quem controla.
     Salvar a ficha manda só o campo que mudou + a versão (409 = outra pessoa alterou: o digitado fica).
     GET /api/anuncios, GET /api/anuncios/ficha, POST /api/anuncios/{ficha,kit,puxar,controle,remover,reincluir}. V20.24: puxar em segundo plano (GET /api/anuncios/puxar/situacao) e POST /api/anuncios/puxar/um.
     V20.24: aba Fotos (computador e Estúdio de Imagens) e "Criar anúncio" no ML em 7 passos, na ordem do dono; cada
     passo grava o rascunho (com a versão) e só libera o seguinte. A ÚNICA escrita no ML é o "Publicar" (perfil Admin):
     erro de rede/504 no Publicar NUNCA repete — a tela relê o rascunho; "incerto" pede para conferir no ML.
     V20.26: Controle de estoque (Manual · Automático) por anúncio do ML controlado pelo Noromak (não-Full) e o painel
     "Estoque automático" por conta na lista. Grava estoque no ML só pelas rotas /api/anuncios/estoque/* (perfil Admin;
     ligar o Automático da conta = senha + 2FA do OWNER). -->

<style>
body{margin:0;background:var(--nk-canvas);color:var(--nk-ink);font-family:var(--nk-font)}
.bloco{margin-top:14px}
.nk-painel{margin-bottom:14px}

.barra input[type=search],.barra select{font:inherit;font-size:13px;border:1px solid var(--nk-line);background:var(--nk-tile);color:var(--nk-ink);border-radius:8px;padding:7px 10px}
.barra input[type=search]{width:280px;max-width:100%}
button.nk-kpi{cursor:pointer;text-align:left;font:inherit}
button.nk-kpi.on{border-color:var(--nk-pri);box-shadow:0 0 0 3px var(--nk-foco)}
.abas{display:flex;gap:4px;border-bottom:1px solid var(--nk-line);margin:14px 0}
.abas button{border:0;background:none;font:inherit;padding:9px 14px;font-size:13px;font-weight:600;color:var(--nk-ink2);border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer}
.abas button.on{color:var(--nk-pri);border-bottom-color:var(--nk-pri)}
.tw{overflow-x:auto}
table.nk-tab{width:100%;font-size:13px}
tr.clica{cursor:pointer}
.mono{font-family:var(--nk-mono,Consolas,monospace);font-size:12px}
.muted{color:var(--nk-ink2);font-size:12px}
.vazio{padding:22px;text-align:center;color:var(--nk-ink2)}
.selos{display:flex;flex-wrap:wrap;gap:4px}
.lay{display:grid;grid-template-columns:190px minmax(0,1fr);gap:16px;align-items:start}
.indice{position:sticky;top:12px;background:var(--nk-tile);border:1px solid var(--nk-line);border-radius:12px;padding:8px}
.indice a{display:flex;justify-content:space-between;align-items:center;padding:7px 9px;border-radius:8px;font-size:13px;color:var(--nk-ink2);text-decoration:none}
.indice a:hover{background:var(--nk-canvas)}
.pt{width:8px;height:8px;border-radius:50%;background:var(--nk-ok);flex:none}
.pt.w{background:var(--nk-warn)}.pt.b{background:var(--nk-bad)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.inteiro{grid-column:1/-1}
.g2>.nk-campo,.g4>.nk-campo{align-content:start}
.orig{font-weight:400;color:var(--nk-ink3);font-size:11px}

.qtd{width:72px;font:inherit;font-size:13px;text-align:right;padding:5px 8px;border:1px solid var(--nk-line);border-radius:7px;background:var(--nk-tile);color:var(--nk-ink)}
.qtd:focus,.skuin:focus{outline:0;border-color:var(--nk-pri);box-shadow:0 0 0 3px var(--nk-foco)}

.conta>div{border:1px solid var(--nk-line);border-radius:10px;padding:10px 12px;background:var(--nk-canvas);font-size:12px;color:var(--nk-ink2)}

.ok{color:var(--nk-ok)}.bad{color:var(--nk-bad)}
.embreve td{color:var(--nk-ink3)}
details.rem summary{cursor:pointer;font-weight:700;font-size:13px;color:var(--nk-head)}
.estq-botao{display:flex;align-items:center;gap:12px;flex-wrap:wrap;width:100%;background:transparent;border:0;padding:0;color:var(--nk-ink);font:inherit;text-align:left;cursor:pointer}
.estq-botao b{font-size:14px;color:var(--nk-head)}
.estq-botao .esp{flex:1}
.estq-botao .bad{color:var(--nk-bad)}
details.rem[open] summary{margin-bottom:10px}
/* V20.24: fotos da ficha e criar anúncio */
.fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.foto{margin:0;border:1px solid var(--nk-line);border-radius:10px;padding:8px;background:var(--nk-canvas);display:grid;gap:6px;align-content:start}
.foto img,.fsel img,.est-imgs img{width:100%;aspect-ratio:1;object-fit:contain;background:#fff;border-radius:6px;display:block}
.foto[draggable=true]{cursor:grab}
.foto.alvo{border-color:var(--nk-pri);box-shadow:0 0 0 3px var(--nk-foco)}
.foto figcaption{display:grid;gap:6px;font-size:12px}
.passo{border:1px solid var(--nk-line);border-radius:12px;padding:12px 14px;margin-top:10px;background:var(--nk-tile)}
.passo h3{margin:0 0 10px;font-size:14px;display:flex;gap:8px;align-items:center;color:var(--nk-head)}
.passo .num{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;font-size:12px;background:var(--nk-canvas);border:1px solid var(--nk-line);flex:none}
.passo.feito .num{background:var(--nk-ok);color:#fff;border-color:var(--nk-ok)}
.passo.travado{opacity:.55}
.passo.travado h3{color:var(--nk-ink2);margin-bottom:4px}
.passo h4{margin:12px 0 6px;font-size:13px;color:var(--nk-head)}
.passo select,.passo input:not([type=checkbox]),.passo textarea{font:inherit;font-size:13px}
.cats{display:grid;gap:6px;margin-top:8px}
.cat-op{text-align:left;font:inherit;font-size:13px;border:1px solid var(--nk-line);background:var(--nk-tile);color:var(--nk-ink);border-radius:8px;padding:8px 10px;cursor:pointer}
.cat-op:hover{border-color:var(--nk-pri)}
.cat-op.on{border-color:var(--nk-pri);box-shadow:0 0 0 3px var(--nk-foco)}
.fotos-cr{display:flex;flex-wrap:wrap;gap:10px}
.fsel{width:124px;border:1px solid var(--nk-line);border-radius:8px;padding:6px;font-size:12px;display:grid;gap:4px;opacity:.55}

.fsel label{cursor:pointer;display:grid;gap:4px}
.erros{margin:6px 0 0;padding-left:18px;font-size:13px}
.erros li{margin:3px 0}
tr.atual td{background:var(--nk-warn-bg)}
.nk-dialogo.estudio{width:min(780px,100%)}
.est-lista{display:grid;gap:12px;margin-top:10px;max-height:55vh;overflow:auto}
.est-imgs{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.est-imgs button{border:1px solid var(--nk-line);border-radius:8px;padding:4px;background:var(--nk-tile);cursor:pointer;width:112px;font:inherit;font-size:11px;color:var(--nk-ink2)}
.est-imgs button.feito{border-color:var(--nk-ok)}
/* V20.26: controle de estoque (cartão por anúncio na ficha; painel por conta na lista) */
.estq-chave{margin-top:8px;padding-top:8px;border-top:1px solid var(--nk-line)}
.estq-chave label{display:flex;gap:6px;align-items:center;cursor:pointer}
.estq{display:grid;gap:10px}
.estq-card{border:1px solid var(--nk-line);border-radius:10px;padding:10px 12px;background:var(--nk-canvas);display:grid;gap:8px;font-size:13px}
.estq-topo{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.estq-topo .esp{flex:1}
.estq-contas{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:10px}
.estq-conta h3{margin:0;font-size:14px;color:var(--nk-head)}
.estq-conta .nums{display:flex;gap:14px;flex-wrap:wrap;color:var(--nk-ink2);font-size:12px}
.estq-conta .nums b{color:var(--nk-head);font-size:15px;margin-right:3px}
.estq ul{margin:0;padding-left:18px}
.casa-sel button:disabled{cursor:default}
.casa-sel button:disabled:not(.on){opacity:.6}
.tipo-sel{flex-wrap:wrap;gap:8px;align-items:center}  /* V20.28: Este produto é: Peça · Kit */
@media (max-width:900px){.lay{grid-template-columns:1fr}.indice{position:static}.g4{grid-template-columns:1fr 1fr}.conta{grid-template-columns:1fr}}
</style>

<body>
<main class="nk-pagina">
  <div class="nk-cab">
    <div>
      <div class="nk-rotulo" id="rotulo">Vendas e anúncios</div>
      <h1 id="titulo">Anúncios</h1>
      <p id="sub">Um produto, uma ficha: os anúncios de todos os canais ligados ao código do Apollo.</p>
    </div>
    <div class="nk-acoes" id="acoes"></div>
  </div>
  <div class="nk-aviso info" id="puxStatus" role="status" aria-live="polite" hidden style="margin-bottom:14px"></div>
  <div id="vista"><div class="vazio">Carregando…</div></div>
</main>
<script>
// V20.23: estado da tela. EU = sessão; PODE = perfil Admin (grava). Supervisor e Consulta só veem.
const $ = id => document.getElementById(id);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"}[c]));
const normCod = s => String(s || "").toUpperCase().replace(/[^0-9A-Z]/g, "");  // = _exp_norm_codigo do servidor
const brl = v => v == null || v === "" ? "—" : Number(v).toLocaleString("pt-BR", {style: "currency", currency: "BRL"});
const quando = v => { if (!v) return "—"; const d = new Date(v); return isNaN(d) ? esc(v) : d.toLocaleString("pt-BR", {day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit"}); };
const SEM_LEITURA = '<span class="muted">sem leitura</span>';
// V20.28: SKU que parece dois códigos do Apollo juntos por hífen e o Admin ainda não escolheu Peça ou Kit
const SELO_KIT = '<span class="nk-selo warn" title="O SKU parece dois códigos juntos por hífen. Abra a ficha e escolha “Este produto é: Peça” ou “Kit”.">kit? confirme a composição</span>';
const qtdOuSem = v => v == null ? SEM_LEITURA : esc(String(v));
const CANAL = {ml: "Mercado Livre", shopee: "Shopee", magalu: "Magalu", tiktok: "TikTok Shop", amazon: "Amazon"};
const CANAL_CURTO = {ml: "ML", shopee: "Shopee", magalu: "Magalu", tiktok: "TikTok", amazon: "Amazon"};
const CONTA = {aracatuba: "Araçatuba", bauru: "Bauru", shopee: "Shopee · Araçatuba", magalu: "Magalu · Araçatuba", tiktok: "TikTok · Bauru"};  // V20.41  // V20.34  // V20.32: conta de estoque da Shopee
const FILIAIS = [["aracatuba", "Araçatuba"], ["bauru", "Bauru"]];
// V20.24: seletor de casa no topo (Todas / Araçatuba / Bauru). Vale para a lista e para a ficha; guardado neste navegador.
const CASA_CHAVE = "nk_anuncios_casa_v2024";
let CASA = "todas";
try { const c = localStorage.getItem(CASA_CHAVE); if (["todas", "aracatuba", "bauru"].includes(c)) CASA = c; } catch (_) {}
// V20.58: ?casa=bauru no endereço (o /tiktok-estoque antigo leva para cá) escolhe a casa e fica guardado
{ const c = new URLSearchParams(location.search).get("casa");
  if (["todas", "aracatuba", "bauru"].includes(c)) { CASA = c; try { localStorage.setItem(CASA_CHAVE, c); } catch (_) {} } }
// V20.58 (dono, 12/11: "não existe opção para controlar o Mercado Livre de Bauru"): os cartões do estoque dizem o canal
const CONTA_EST = {aracatuba: "Mercado Livre · Araçatuba", bauru: "Mercado Livre · Bauru"};
const nomeContaEst = c => CONTA_EST[c] || CONTA[c] || c;
const filiaisVisiveis = () => FILIAIS.filter(([f]) => CASA === "todas" || f === CASA);
const daCasa = a => CASA === "todas" || a.conta === CASA;
function seletorCasa() {
  return `<span class="casa-sel" role="group" aria-label="Casa">${[["todas", "Todas"], ["aracatuba", "Araçatuba"], ["bauru", "Bauru"]]
    .map(([v, n]) => `<button type="button" class="${CASA === v ? "on" : ""}" aria-pressed="${CASA === v}" onclick="trocarCasa('${v}')">${esc(n)}</button>`).join("")}</span>`;
}
function trocarCasa(v) {
  if (!["todas", "aracatuba", "bauru"].includes(v) || v === CASA) return;
  CASA = v;
  try { localStorage.setItem(CASA_CHAVE, v); } catch (_) {}
  // ficha: só refiltra o que já está na tela (o digitado está em FORM/CR e não se perde); lista: relê com a conta
  // V20.59: a lista da casa anterior não fica na tela enquanto a nova é lida ("Carregando…" até chegar)
  if (F) desenharFicha(); else { L.dados = null; desenharLista(); carregarLista(); }
}
const CONTROLE = {noromak: ["Noromak", "ok"], alephee: ["Alephee", "warn"], full: ["Full", "info"], tiktok: ["Extensão do TikTok", "info"]};  // V20.40  // V20.58: a tela Estoque TikTok saiu do menu
const STATUS = {active: "Ativo", paused: "Pausado", closed: "Encerrado", under_review: "Em revisão", inactive: "Inativo"};
const TIPO_ANUNCIO = {gold_special: "Clássico", gold_pro: "Premium", gold_premium: "Premium", free: "Grátis"};
const ORIGEM = {admin: "da ficha", anuncio_ml: "do anúncio ML", anuncio_tiktok: "do anúncio TikTok", alephee: "da Alephee", apollo: "do Apollo", agente: "do agente (confira)"};  // V20.41: anuncio_tiktok
// Ordem decidida pelo dono: título → categoria → o resto (a criação de anúncio segue essa ordem).
const SECOES = [
  {id: "sec-produto", nome: "Produto", sub: "O nome é o título do produto: o anúncio é montado a partir dele.", campos: [
    ["nome", "Título / nome do produto", "inteiro"], ["categoria_ml", "Categoria do ML", "inteiro"],
    ["marca", "Marca"], ["modelo", "Modelo"], ["descricao", "Descrição", "inteiro", "area"]]},
  {id: "sec-codigos", nome: "Códigos", sub: "EAN (código de barras) e NCM da nota.", campos: [["ean", "EAN"], ["ncm", "NCM"]]},
  {id: "sec-medidas", nome: "Peso e medidas", sub: "Da embalagem de envio. Vazio = não sabemos (nunca zero).", campos: [
    ["peso_g", "Peso (g)", "", "num"], ["altura_cm", "Altura (cm)", "", "num"], ["largura_cm", "Largura (cm)", "", "num"],
    ["comprimento_cm", "Comprimento (cm)", "", "num"]]},
];
const OBRIGATORIOS = ["nome", "marca", "ean", "peso_g", "altura_cm", "largura_cm", "comprimento_cm"];
const EM_BREVE = ["shopee", "magalu", "tiktok", "amazon"];

let EU = null, PODE = false;
let L = {aba: "fichas", filtro: "", busca: "", dados: null};
let F = null;            // payload da ficha aberta
let ABA = "ficha";
let FORM = {}, BASE = {}, CONFLITO = {};  // ficha: digitado, gravado quando a tela leu, valor de quem alterou
let KIT = null;          // {sku, nome, base:[...], comps:[...], versao_storage}
let buscaTimer = null;

async function api(url, corpo) {
  const r = await fetch("/expedicao" + url, corpo
    ? {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(corpo), credentials: "same-origin", cache: "no-store"}
    : {credentials: "same-origin", cache: "no-store"});
  let d = {};
  try { d = await r.json(); } catch (_) {}
  if (!r.ok) { const e = new Error(d.mensagem && d.error === "CONFLITO" ? d.mensagem : (d.error || ("HTTP " + r.status))); e.status = r.status; e.dados = d; throw e; }
  return d;
}

function codigoDaUrl() { return new URLSearchParams(location.search).get("codigo") || ""; }
function irPara(params) {
  const q = new URLSearchParams(params).toString();
  history.pushState(null, "", location.pathname + (q ? "?" + q : ""));
  rota();
}
function rota() {
  const cod = codigoDaUrl();
  const aba = new URLSearchParams(location.search).get("aba");
  if (cod) { ABA = ["ficha", "kits", "composicao", "fotos", "anuncios"].includes(aba) ? aba : "ficha"; abrirFicha(cod); }
  else { F = null; KIT = null; desenharLista(); carregarLista(); }
}
window.addEventListener("popstate", async () => {
  if (F && (fichaSuja() || kitSujo()) && normCod(codigoDaUrl()) !== normCod(F.codigo)) {
    const voltar = location.search;
    history.pushState(null, "", location.pathname + "?codigo=" + encodeURIComponent(F.codigo) + "&aba=" + ABA);
    if (!await nkConfirmar("Sair sem salvar o que foi digitado?", {ok: "Sair sem salvar", perigo: true})) return;
    FORM = {}; BASE = {}; KIT = null;
    history.pushState(null, "", location.pathname + voltar);
  }
  rota();
});
window.addEventListener("beforeunload", e => { if (fichaSuja() || kitSujo() || crMudados().length) { e.preventDefault(); e.returnValue = ""; } });

// ---------------------------------------------------------------- lista
function acoesLista() {
  // V20.24: "Puxar anúncios do ML" roda em segundo plano (PUX); "Puxar um" lê só o anúncio colado (MLB ou link)
  $("acoes").innerHTML = seletorCasa() + (PODE ? `<button class="nk-btn pri" id="btnPuxar" onclick="puxar()" ${PUX.rodando ? "disabled" : ""}><i class=nk-i-download></i> ${PUX.rodando ? "Puxando…" : "Puxar anúncios do ML"}</button>
      <button class="nk-btn" id="btnPuxarTiktok" onclick="puxarTiktok()" ${TTC.rodando ? "disabled" : ""}><i class=nk-i-download></i> ${TTC.rodando ? "Lendo o TikTok…" : "Puxar anúncios do TikTok"}</button>
      <span class="puxum"><input type="text" id="puxUmTexto" placeholder="MLB ou link do anúncio" aria-label="MLB ou link do anúncio" onkeydown="if(event.key==='Enter')puxarUm()"><button class="nk-btn" id="btnPuxarUm" onclick="puxarUm()">Puxar um</button></span>
      <button class="nk-btn" onclick="novoProduto()">+ Novo produto</button>` : "")
    + `<button class="nk-btn" onclick="carregarLista();carregarPainelEstoque()"><i class=nk-i-refresh></i> Atualizar</button>`;
}
// V20.59 (dono, 12/11: "a mudança de casas está demorando para puxar os anúncios corretos de cada casa"): só vale a
// resposta da ÚLTIMA leitura pedida. Antes a resposta atrasada da casa anterior (ou da busca anterior) chegava depois e
// cobria a da casa escolhida.
let LISTA_SEQ = 0;
async function carregarLista() {
  const filtro = L.aba === "sem_ficha" ? "sem_ficha" : L.filtro;
  const seq = ++LISTA_SEQ;
  let d;
  try {
    d = await api(`/api/anuncios?busca=${encodeURIComponent(L.busca)}&filtro=${encodeURIComponent(filtro)}${CASA === "todas" ? "" : "&conta=" + CASA}`);
    if (seq !== LISTA_SEQ) return;  // chegou depois de outra troca de casa, busca ou filtro: descartada
    L.dados = d;

function tipoAtual() { return KIT && KIT.novoTipo ? "kit" : (F.tipo === "kit" ? "kit" : "peca"); }
function seletorTipo() {

async function escolherTipo(t) {
  if (!PODE || !F) return;
  const atual = tipoAtual();
  if (t === "peca" && KIT && KIT.novoTipo) {  // desistiu do kit que ainda não foi salvo
    if (KIT.comps.some(c => c.sku) && !await nkConfirmar("Descartar as peças escolhidas para o kit?", {ok: "Descartar", perigo: true})) return;
    KIT = null; trocarAba("kits"); return;
  }
  if (t === "kit" && atual === "peca") {
    if (F.naoExiste) { nkToast("Salve a ficha do produto antes de marcar como kit.", "aviso"); return; }

    KIT = {sku: F.codigo, nome: (F.ficha && F.ficha.campos && F.ficha.campos.nome) || "", fonte: "cadastro", ativo: true, novoTipo: true,

    trocarAba("composicao");

  if (t === "peca" && atual === "peca" && !F.kit_suspeito) return;
  if (t === atual && F.tipo_confirmado_por) { if (t === "kit") trocarAba("composicao"); return; }
  const txt = t === "peca" && atual === "kit"
    ? `Marcar ${F.codigo} como peça?\nO kit fica desativado no Cadastro de Kits (não é apagado): a venda deste código deixa de abrir nas peças na Conferência. Anúncios em Automático voltam a Manual.`
    : `Confirmar que ${F.codigo} é ${t === "kit" ? "um kit" : "uma peça"}?`;
  if (!await nkConfirmar(txt, {ok: t === "kit" ? "É kit" : "É peça", perigo: t === "peca" && atual === "kit"})) return;
  try {

    nkToast(`${F.codigo}: ${t === "kit" ? "kit" : "peça"}.${(r.voltaram_manual || []).length ? ` ${r.voltaram_manual.length} anúncio(s) voltaram a Manual.` : ""}`, "ok");
    KIT = null;
    await abrirFicha(F.codigo, {manter: true, apollo: !!F.apollo_lido});
  } catch (e) { nkToast(e.message, "erro", {duracao: 9000}); }

function desenharAba() {

// --- aba Ficha do produto
function bolinha(sec) {

  if (vazios.some(c => OBRIGATORIOS.includes(c))) return "b";
  return vazios.length ? "w" : "";

    const mudou = (FORM[c] ?? "") !== (BASE[c] ?? "");
    // V20.23: campo vazio com origem admin = o Admin apagou; a importação não preenche de novo
    const apagado = !mudou && vazio && origem[c] === "admin";
    const o = mudou ? "alterado, não salvo" : (apagado ? "apagado pelo Admin" : (ORIGEM[origem[c]] || ""));
    const rot = `<span>${esc(rotulo)} ${vazio && obrig ? '<span class="orig bad">obrigatório</span>' : ""}${o && (!vazio || !obrig || mudou || apagado) ? ` <span class="orig">${esc(o)}</span>` : ""}</span>`;
    const ctl = tipo === "area"
      ? `<textarea rows="4" data-campo="${c}" ${ro} oninput="digitou(this)">${esc(FORM[c])}</textarea>`
      : `<input data-campo="${c}" value="${esc(FORM[c])}" ${tipo === "num" ? 'inputmode="decimal"' : ""} ${c === "categoria_ml" ? 'placeholder="ex.: MLB1234 — a sugestão pelo ML entra na próxima fase"' : ""} ${ro} oninput="digitou(this)">`;
    const k = CONFLITO[c];
    const conf = k ? `<div class="gravado">Outra pessoa gravou: <b>${k.valor ? esc(k.valor) : "(vazio)"}</b>${k.origem ? ` <span class="orig">${esc(ORIGEM[k.origem] || k.origem)}</span>` : ""}
        <button type="button" class="nk-btn mini" onclick="usarGravado('${c}')">Usar o gravado</button></div>` : "";
    return `<label class="nk-campo ${cls || ""} ${vazio && obrig ? "falta" : ""} ${mudou ? "mudou" : ""}">${rot}${ctl}${conf}</label>`;
  };
  const n = camposMudados().length;
  $("conteudo").innerHTML = `
    ${Object.keys(CONFLITO).length ? '<div class="nk-aviso bad" style="margin-bottom:14px">Outra pessoa alterou esta ficha enquanto você digitava. O que você digitou foi mantido; ao lado de cada campo está o que ela gravou. Confira e salve de novo.</div>' : ""}
    ${F.naoExiste ? `<div class="nk-aviso info" style="margin-bottom:14px">Este código ainda não tem ficha nem anúncio. ${PODE ? "Preencha e salve para criar." : ""}</div>` : ""}
    <div class="lay">
      <nav class="indice" aria-label="Seções da ficha">
        ${SECOES.map(s => `<a href="#${s.id}" onclick="event.preventDefault();document.getElementById('${s.id}').scrollIntoView({behavior:'smooth',block:'start'})">${esc(s.nome)} <span class="pt ${bolinha(s)}"></span></a>`).join("")}
      </nav>
      <div>
        ${SECOES.map(s => `<section class="nk-painel" id="${s.id}">
          <div class="nk-painel-tit"><div><h2>${esc(s.nome)}</h2><p>${esc(s.sub)}</p></div></div>
          <div class="${s.id === "sec-medidas" ? "g4" : "g2"}">${s.campos.map(campo).join("")}</div></section>`).join("")}
        ${PODE ? `<div class="barra"><span class="esp"></span>
          ${n ? `<button class="nk-btn" onclick="descartar()">Descartar alterações</button>` : ""}
          <button class="nk-btn pri" id="btnSalvar" onclick="salvarFicha()" ${n ? "" : "disabled"}><i class=nk-i-save></i> ${n ? `Salvar ficha (${n} campo${n > 1 ? "s" : ""})` : "Salvar ficha"}</button></div>` : ""}
        ${ficha && ficha.atualizado_em ? `<p class="muted">Última alteração ${quando(ficha.atualizado_em)}${ficha.atualizado_por ? " por " + esc(ficha.atualizado_por) : ""} · versão ${ficha.versao}</p>` : ""}
      </div>

}
function digitou(el) {
  FORM[el.dataset.campo] = el.value;
  const n = camposMudados().length;
  const b = $("btnSalvar");
  if (b) { b.disabled = !n; b.innerHTML = `<i class=nk-i-save></i> ${n ? `Salvar ficha (${n} campo${n > 1 ? "s" : ""})` : "Salvar ficha"}`; }
  const lab = el.closest(".nk-campo"); if (lab) lab.classList.toggle("mudou", (FORM[el.dataset.campo] ?? "") !== (BASE[el.dataset.campo] ?? ""));
  // a bolinha do índice acompanha o que está na tela

function usarGravado(c) { FORM[c] = BASE[c]; delete CONFLITO[c]; desenharCampos(); }
function descartar() { FORM = {...BASE}; CONFLITO = {}; desenharCampos(); }
async function salvarFicha() {
  const mud = camposMudados();
  if (!mud.length) return;
  const campos = {};
  mud.forEach(c => { campos[c] = (FORM[c] || "").trim(); });  // V20.23: só o que mudou (o resto não vira origem "admin")
  const corpo = {codigo: F.codigo, campos};
  if (F.ficha) corpo.versao = F.ficha.versao;
  const b = $("btnSalvar"); if (b) b.disabled = true;
  try {
    await api("/api/anuncios/ficha", corpo);
    CONFLITO = {};
    nkToast("Ficha salva.", "ok");
    await abrirFicha(F.codigo, {manter: true, salvos: mud, apollo: !!F.apollo_lido});
  } catch (e) {
    if (e.status === 409 && e.dados && e.dados.atual) { conflitoFicha(e.dados.atual); return; }

// V20.23: 409 = outra pessoa salvou depois que a tela leu. Nada do digitado se perde: a base passa a ser a ficha
// gravada agora (versão nova) e cada campo que a pessoa mexeu mostra o valor dela ao lado.
function conflitoFicha(atual) {
  const gravados = atual.campos || {}, origem = atual.origem || {};
  const novaBase = {};
  SECOES.forEach(s => s.campos.forEach(([c]) => { novaBase[c] = fmtCampo(gravados[c]); }));
  CONFLITO = {};
  Object.keys(FORM).forEach(c => {
    const mexido = (FORM[c] ?? "") !== (BASE[c] ?? "");
    if (mexido && novaBase[c] !== BASE[c] && novaBase[c] !== FORM[c]) CONFLITO[c] = {valor: novaBase[c], origem: origem[c]};
    if (!mexido) FORM[c] = novaBase[c];
  });
  BASE = novaBase;
  F.ficha = atual;
  F.naoExiste = false;
  nkToast("Outra pessoa alterou esta ficha. O que você digitou foi mantido: confira e salve de novo.", "aviso", {duracao: 9000});
  desenharFicha();
}

// --- aba Kits
function prepararKit(manter) {
  if (manter && kitSujo()) { KIT.versao_storage = F.versao_kits; return; }
  if (F.tipo !== "kit" || !F.composicao) { KIT = null; return; }
  const comps = (F.composicao.componentes || []).map(c => ({sku: c.sku, quantidade: String(c.quantidade)}));
  KIT = {sku: F.composicao.sku_kit || F.codigo, nome: F.composicao.nome || "", fonte: F.composicao.fonte, ativo: F.composicao.ativo,
    base: JSON.stringify(comps), comps, versao_storage: F.versao_kits};
}
function kitSujo() { return !!KIT && JSON.stringify(KIT.comps.map(c => ({sku: c.sku, quantidade: String(c.quantidade)}))) !== KIT.base; }
function estoquePeca(filial, sku) {
  const e = (F.estoque || {})[filial];
  if (!e) return {disp: null, pend: null};
  const k = normCod(sku);
  return {disp: e.disponivel ? (e.disponivel[k] ?? null) : null, pend: e.pendente ? (e.pendente[k] ?? 0) : null};
}
// mesma conta do servidor (kit_da_para_montar): a peça que dá menos manda; sem leitura = sem número, nunca zero
function daParaMontar(filial, comps) {
  let menor = null;
  for (const c of comps) {
    const q = Number(String(c.quantidade).replace(",", "."));
    if (!(q > 0)) return null;
    const {disp, pend} = estoquePeca(filial, c.sku);
    if (disp == null || pend == null) return null;
    const n = Math.max(0, Math.floor((disp - pend) / q));
    menor = menor == null ? n : Math.min(menor, n);
  }
  return menor;
}
function quadroEstoque(comps, ehKit) {
  const lido = F.apollo_lido;
  const linha = ([f, nomeF]) => {
    const e = (F.estoque || {})[f] || {};
    const n = daParaMontar(f, comps);
    return `<div>${ehKit ? "Dá para montar" : "Livre para vender"} · ${nomeF}<b>${n == null ? "sem leitura" : `${n} ${ehKit ? "kit(s)" : "un."}`}</b>${e.erro ? `<span class="bad">${esc(e.erro)}</span>` : lido ? "Apollo − vendido na fila (a baixar)" : "Apollo não lido ainda"}</div>`;
  };
  return `<div class="conta">${filiaisVisiveis().map(linha).join("")}
    ${ehKit ? `<div>Custo do kit<b>—</b>na fase de preço</div>
    <div>Na venda de 1 kit, o Apollo compromete<b>${comps.filter(c => c.sku).map(c => `${esc(c.quantidade)} × ${esc(c.sku)}`).join(" + ") || "—"}</b>no atendimento</div>` : ""}</div>`;
}

      if (seq !== BUSCA_COMP.seq || !KIT || !KIT.comps[i] || KIT.comps[i].sku !== v) return;

      if (dl) dl.innerHTML = (r.itens || []).map(p => `<option value="${esc(p.codigo)}">${esc(p.nome || p.codigo)}</option>`).join("");
      const ex = (r.itens || []).find(p => normCod(p.codigo) === normCod(v));
      KIT.comps[i].achado = !!r.exato;

async function salvarKit(tentativa = 0, confirmarProduto = false) {
  const comps = KIT.comps.map(c => ({sku: String(c.sku || "").trim(), quantidade: Number(String(c.quantidade).replace(",", "."))}));
  if (comps.some(c => !c.sku)) { nkToast("Preencha o código de todo componente (ou remova a linha).", "aviso"); return; }
  if (comps.some(c => !Number.isInteger(c.quantidade) || c.quantidade < 1 || c.quantidade > 999)) { nkToast("A quantidade de cada componente deve ser um número inteiro de 1 a 999.", "aviso"); return; }
  if (!tentativa && !confirmarProduto && !await nkConfirmar(`Salvar o kit ${KIT.sku} com ${comps.map(c => `${c.quantidade} × ${c.sku}`).join(" + ")}?\nVale para a Conferência, a Shopee, o Financeiro e a Demanda (mesmo Cadastro de Kits).`, {ok: "Salvar", perigo: false})) return;
  try {
    // V20.28: a aba Composição do kit grava pela escolha "Este produto é: Kit" (confirma o tipo na ficha)
    const r = await api("/api/anuncios/ficha/tipo", {codigo: KIT.sku, tipo: "kit", nome: KIT.nome || ((F.ficha && F.ficha.campos.nome) || ""), componentes: comps,
      versao_storage: KIT.versao_storage, confirmar_produto: confirmarProduto});
    nkToast(`Kit salvo.${(r.voltaram_manual || []).length ? ` ${r.voltaram_manual.length} anúncio(s) voltaram a Manual.` : ""}`, "ok");
    KIT = null;
    await abrirFicha(F.codigo, {manter: true, apollo: !!F.apollo_lido});
  } catch (e) {
    if (e.status === 400 && (e.dados || {}).codigo_erro === "CODIGO_DE_PRODUTO" && !confirmarProduto) {
      if (await nkConfirmar(e.message, {ok: "Confirmar: é kit", perigo: true})) return salvarKit(tentativa, true);
      return;
    }
    if (e.status === 409 && !tentativa) {
      // V20.23: o Cadastro de Kits inteiro tem uma versão só; se ESTE kit não mudou, a outra alteração foi em outro
      // kit e o salvar segue com a versão nova. Se mudou, mostra o atual e não grava por cima.
      const meus = KIT.comps, base = KIT.base;
      try {
        const [d, vk] = await Promise.all([api(`/api/anuncios/ficha?codigo=${encodeURIComponent(F.codigo)}${F.apollo_lido ? "&apollo=1" : ""}`),
          api("/api/storage?versions=conf_kits").then(x => (x.versions || {}).conf_kits)]);
        const agora = JSON.stringify(((d.composicao || {}).componentes || []).map(c => ({sku: c.sku, quantidade: String(c.quantidade)})));
        if (agora === base) { KIT.versao_storage = vk; return salvarKit(1, confirmarProduto); }
        F = {...d, versao_kits: vk};
        prepararKit(false);
        const gravado = KIT.comps.map(c => `${c.quantidade} × ${c.sku}`).join(" + ") || "(vazio)";
        KIT.comps = meus;  // o digitado fica na tela; a próxima gravação confere contra a versão nova
        desenharKits();
        nkToast(`Outra pessoa alterou este kit: agora está ${gravado}. O que você digitou ficou na tela; confira e salve de novo.`, "aviso", {duracao: 12000});
      } catch (e2) { nkToast(e2.message, "erro"); }
      return;
    }
    nkToast(e.message, "erro");
  }
}

async function mudarModoConta(conta, modo, jaConfirmou) {
  const d = PE.contas[conta];
  if (!PODE || !d || !d.config || d.config.modo === modo || !ESTQ_MODO_CONTA[modo]) return;
  if (!jaConfirmou) {
    const txt = modo === "automatico"
      ? `Ligar o envio automático de estoque em ${nomeContaEst(conta)}?\nO Noromak passa a enviar sozinho ${ESTQ_FORA[conta] ? ESTQ_FORA[conta][3] : "ao Mercado Livre"} o estoque calculado pelo Apollo dos anúncios em Automático (${Number((d.resumo || {}).automatico || 0)} hoje), sempre que o número mudar. Pede a senha e o código 2FA do proprietário.`
      : `Passar o estoque automático de ${nomeContaEst(conta)} para ${ESTQ_MODO_CONTA[modo]}?\n${ESTQ_MODO_TXT[modo]}`;
    if (!await nkConfirmar(txt, {ok: modo === "automatico" ? "Ligar o Automático" : `Passar para ${ESTQ_MODO_CONTA[modo]}`, perigo: false})) return;
  }
  try {
    await api("/api/anuncios/estoque/config", {conta, modo});
    nkToast(`${nomeContaEst(conta)}: estoque automático em ${ESTQ_MODO_CONTA[modo]}.`, "ok");
  } catch (e) {
    if (e.status === 428 && (e.dados || {}).code === "OWNER_REAUTH_REQUIRED") {
      if (await pedirOwner("Ligar o Automático do estoque exige a senha e o código 2FA do proprietário.")) return mudarModoConta(conta, modo, true);
      return;
    }
    nkToast(e.message, "erro");
  }
  carregarPainelEstoque();
}
async function enviarAgoraConta(b) {
  const conta = b.dataset.conta, d = PE.contas[conta];

const ENVIO_ACOMP = {};  // conta -> timer do acompanhamento (um por conta)
async function acompanharEnvioConta(conta) {
  clearTimeout(ENVIO_ACOMP[conta]);
  let d;
  try { d = await api(`/api/anuncios/estoque?conta=${encodeURIComponent(conta)}`); }
  catch (e) {
    if (e.status === 401 || e.status === 403) { delete ENVIO_ACOMP[conta]; return; }  // sessão caiu: para de perguntar
    ENVIO_ACOMP[conta] = setTimeout(() => acompanharEnvioConta(conta), 3000);
    return;
  }
  if (PE.casa === CASA && PE.contas[conta] !== undefined) { PE.contas[conta] = d; desenharPainelEstoque(); }
  const env = d.envio || {};
  if (env.rodando) { ENVIO_ACOMP[conta] = setTimeout(() => acompanharEnvioConta(conta), 3000); return; }
  delete ENVIO_ACOMP[conta];
  const r = env.resultado || {};
  if (env.erro) { nkToast(`${nomeContaEst(conta)}: ${env.erro}`, "erro", {duracao: 12000}); return; }
  const partes = [`${Number(r.enviados || 0)} enviado(s)`];
  if (r.erros) partes.push(`${Number(r.erros)} com erro`);
  if (r.ignorados) partes.push(`${Number(r.ignorados)} ignorado(s)`);
  nkToast(`${nomeContaEst(conta)}: ${partes.join(", ")}.${r.erros ? " Veja o registro." : ""}`, r.erros ? "aviso" : "ok", {duracao: 12000});
}
async function mudarDescontaConta(inp) {

// Senha + 2FA do proprietário (POST /api/security/owner/reauth), como nas Promoções automáticas e no TikTok.
function pedirOwner(texto) {
  return new Promise(resolver => {
    const anterior = document.activeElement;
    const fundo = document.createElement("div");
    fundo.className = "nk-dialogo-fundo";
    fundo.innerHTML = `<form class="nk-dialogo" role="dialog" aria-modal="true" aria-labelledby="ownerTit" novalidate>
      <h2 id="ownerTit">Confirmação do proprietário</h2><div class="nk-dialogo-txt">${esc(texto)}</div>
      <input class="nk-dialogo-campo" type="password" autocomplete="current-password" placeholder="Senha" aria-label="Senha">
      <input class="nk-dialogo-campo" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="Código 2FA" aria-label="Código 2FA">
      <div class="nk-dialogo-erro" hidden></div>
      <div class="nk-dialogo-acoes"><button type="button" class="nk-btn" data-r="0">Cancelar</button><button type="submit" class="nk-btn pri">Confirmar</button></div></form>`;
    const [senha, codigo] = fundo.querySelectorAll("input"), erro = fundo.querySelector(".nk-dialogo-erro");
    const teclas = e => { if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); fim(false); } };
    const fim = r => { document.removeEventListener("keydown", teclas, true); fundo.remove(); try { anterior && anterior.focus && anterior.focus(); } catch (_) {} resolver(r); };
    fundo.querySelector("form").addEventListener("submit", async e => {
      e.preventDefault();
      if (!senha.value || !codigo.value.trim()) { erro.textContent = "Preencha a senha e o código."; erro.hidden = false; return; }
      try { await api("/api/security/owner/reauth", {password: senha.value, code: codigo.value.trim()}); fim(true); }
      catch (ex) { erro.textContent = ex.message; erro.hidden = false; codigo.value = ""; codigo.focus(); }
    });
    fundo.addEventListener("click", e => { if (e.target.closest('button[data-r="0"]') || e.target === fundo) fim(false); });
    document.addEventListener("keydown", teclas, true);
    document.body.append(fundo);
    senha.focus();
  });
}

// ---------------------------------------------------------------- V20.24: fotos da ficha
const enc = encodeURIComponent;
const tamanho = b => b == null ? "—" : b >= 1048576 ? (b / 1048576).toFixed(1).replace(".", ",") + " MB" : Math.max(1, Math.round(b / 1024)) + " KB";
const urlFoto = id => `/expedicao/api/anuncios/foto?id=${enc(id)}`;
let ARRASTO = null;
function desenharFotos() {
  const fotos = F.fotos || [];

        ${PODE ? `<div class="selos"><label class="nk-btn mini pri">Enviar do computador<input type="file" id="fotoArq" accept="image/jpeg,image/png,image/webp" multiple hidden onchange="enviarFotos(this.files)"></label>

      <p class="muted" id="fotoAndamento"></p>

    </section>`;
}
function cartaoFoto(f, i, n) {
  const id = Number(f.id);
  const arrastar = PODE ? `draggable="true" ondragstart="ARRASTO=${id}" ondragover="event.preventDefault();this.classList.add('alvo')" ondragleave="this.classList.remove('alvo')" ondrop="event.preventDefault();soltarFoto(${id})"` : "";
  return `<figure class="foto" ${arrastar}>
    <img src="${urlFoto(id)}" alt="Foto ${i + 1}" loading="lazy">
    <figcaption><div>${i === 0 ? '<span class="nk-selo ok">Principal</span>' : `<b>${i + 1}ª</b>`} <span class="muted">${esc(f.largura)}×${esc(f.altura)} px · ${tamanho(f.bytes)}${f.origem === "estudio" ? " · Estúdio" : f.origem === "anuncio_ml" ? " · do anúncio ML" : f.origem === "anuncio_tiktok" ? " · do anúncio TikTok" : ""}</span></div>
    ${PODE ? `<div class="selos"><button type="button" class="nk-btn mini" ${i === 0 ? "disabled" : ""} onclick="moverFoto(${i},-1)" aria-label="Mover para a esquerda">←</button><button type="button" class="nk-btn mini" ${i === n - 1 ? "disabled" : ""} onclick="moverFoto(${i},1)" aria-label="Mover para a direita">→</button><button type="button" class="nk-btn mini perigo" onclick="removerFoto(${id})">Remover</button></div>` : ""}</figcaption></figure>`;
}
async function relerFotos() {
  try { const d = await api(`/api/anuncios/ficha?codigo=${enc(F.codigo)}`); F.fotos = d.fotos || []; } catch (_) {}
}
function fotosMudaram() { if (ABA === "fotos" || ABA === "anuncios") desenharFicha(); }
async function gravarOrdemFotos(ids) {
  try { const r = await api("/api/anuncios/foto/ordenar", {codigo: F.codigo, ids}); F.fotos = r.fotos || []; }
  catch (e) { nkToast(e.message, "erro"); await relerFotos(); }
  fotosMudaram();
}
function moverFoto(i, d) {
  const ids = (F.fotos || []).map(f => f.id), j = i + d;
  if (j < 0 || j >= ids.length) return;
  [ids[i], ids[j]] = [ids[j], ids[i]];
  gravarOrdemFotos(ids);
}
function soltarFoto(alvo) {
  const de = ARRASTO; ARRASTO = null;
  if (de == null || de === alvo) { fotosMudaram(); return; }
  const orig = (F.fotos || []).map(f => f.id);
  const ids = orig.filter(x => x !== de);
  const k = ids.indexOf(alvo);
  if (k < 0) return;
  ids.splice(orig.indexOf(de) < orig.indexOf(alvo) ? k + 1 : k, 0, de);
  gravarOrdemFotos(ids);
}
async function removerFoto(id) {
  if (!await nkConfirmar("Remover esta foto da ficha?\nO arquivo é apagado. Rascunho de anúncio que usava a foto pede para escolher as fotos de novo.", {ok: "Remover", perigo: true})) return;
  try { const r = await api("/api/anuncios/foto/remover", {codigo: F.codigo, id}); F.fotos = r.fotos || []; nkToast("Foto removida.", "ok"); }
  catch (e) { nkToast(e.message, "erro"); await relerFotos(); }
  fotosMudaram();
}
async function enviarFotos(lista) {
  const arqs = [...(lista || [])];
  const inp = $("fotoArq"); if (inp) inp.value = "";
  let ok = 0;
  for (const [k, a] of arqs.entries()) {
    const and = $("fotoAndamento"); if (and) and.textContent = `Enviando ${k + 1} de ${arqs.length}: ${a.name}…`;
    if (a.size > 10 * 1024 * 1024) { nkToast(`${a.name}: passa de 10 MB.`, "erro", {duracao: 9000}); continue; }
    try {
      const b64 = await new Promise((res, rej) => {
        const fr = new FileReader();
        fr.onload = () => res(String(fr.result || "").split(",")[1] || "");
        fr.onerror = () => rej(new Error("não consegui ler o arquivo"));
        fr.readAsDataURL(a);
      });
      const r = await api("/api/anuncios/foto", {codigo: F.codigo, base64: b64});  // um POST por arquivo
      F.fotos = r.fotos || []; ok++;
    } catch (e) { nkToast(`${a.name}: ${e.message}`, "erro", {duracao: 9000}); }
  }
  if (ok) nkToast(`${ok} foto(s) enviada(s).`, "ok");
  fotosMudaram();
}
// Janela do Estúdio de Imagens: trabalhos prontos; clicar numa imagem traz o arquivo para a ficha (o servidor copia).

    } catch (e) { lista.innerHTML = `<div class="nk-aviso bad">${esc(e.message)}</div>`; }

  lista.addEventListener("click", async e => {

      nkToast("Foto trazida do Estúdio.", "ok");

  busca.addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(carregar, 350); });

// ---------------------------------------------------------------- V20.24: criar anúncio no ML (rascunho em passos)
// Ordem do dono: cada passo só libera o seguinte. Cada "Salvar" grava o rascunho com a versão (409 = outra pessoa
// alterou: o digitado fica na tela). Nada vai ao ML até o "Publicar" (o "Conferir" usa o /items/validate, que não cria).

// --- V20.32: criar anúncio na Shopee (Araçatuba). Um formulário só: a Shopee não tem "conferir sem criar" — o
// Conferir é do Noromak (limites, atributos, marca e canais que a Shopee publica); só o Publicar cria o anúncio.
// Peso e medidas vêm da ficha na hora (nunca copiados para o rascunho).
const SH_SIT = {rascunho: ["Rascunho", ""], validado: ["Conferido", "info"], publicando: ["Publicando…", "warn"],
  publicado: ["Publicado", "ok"], erro: ["Recusado pela Shopee", "bad"], incerto: ["Confira no Seller Center", "bad"]};
let SH = {codigo: null, lista: null, erro: "", r: null, f: null, cats: null, defs: null, marcas: null, marcaObrig: false,
  marcaFicha: null, limites: null, conta: null, ocupado: ""};
let shContaTimer = null;
const shAberto = () => !!SH.f;
const shEditavel = () => !SH.r || EDITAVEL.includes(SH.r.situacao);

async function carregarShopee(forcar) {
  if (!F || F.naoExiste) { SH.lista = []; desenharShopee(); return; }
  const cod = F.codigo;
  if (!forcar && SH.codigo === cod && SH.lista) { desenharShopee(); return; }
  try {
    const d = await api(`/api/anuncios/shopee/rascunhos?codigo=${enc(cod)}`);
    if (!F || F.codigo !== cod) return;
    if (SH.codigo !== cod) SH = {...SH, r: null, f: null, cats: null, defs: null, marcas: null, conta: null};
    SH.codigo = cod; SH.lista = d.rascunhos || []; SH.erro = "";
  } catch (e) { SH.lista = null; SH.erro = e.message; }
  desenharShopee();
}
function shForm(r) {
  const campos = (F.ficha && F.ficha.campos) || {};
  return r ? {titulo: r.titulo || "", categoria: r.categoria || "", categoria_nome: r.categoria_nome || "",
      descricao: r.descricao || "", preco: r.preco == null ? "" : String(r.preco).replace(".", ","),
      quantidade: r.quantidade == null ? "" : String(r.quantidade), atributos: JSON.parse(JSON.stringify(r.atributos || {})),
      marca: {...(r.marca || {})}, fotos: [...(r.fotos || [])]}
    : {titulo: String(campos.nome || "").replace(/\s+/g, " ").trim(), categoria: "", categoria_nome: "",
      descricao: String(campos.descricao || ""), preco: "", quantidade: "", atributos: {}, marca: {},
      fotos: (F.fotos || []).map(x => x.id).slice(0, 9)};
}
function novoShopee() { SH.r = null; SH.f = shForm(null); SH.cats = null; SH.defs = null; SH.marcas = null; SH.conta = null; desenharShopee(); }
async function abrirShopee(id) {
  const r = (SH.lista || []).find(x => x.id === id); if (!r) return;
  SH.r = r; SH.f = shForm(r); SH.cats = null; SH.conta = null;
  desenharShopee();
  if (r.categoria) await shCarregarCategoria(r.categoria);
  shPedirConta();
}
function fecharShopee() { SH.r = null; SH.f = null; desenharShopee(); }

async function shSugerir() {
  if (!SH.f.titulo.trim()) { nkToast("Escreva o título antes.", "aviso"); return; }
  SH.ocupado = "cats"; desenharShopee();
  try {
    const d = await api(`/api/anuncios/shopee/categorias?titulo=${enc(SH.f.titulo)}`);
    SH.cats = d.categorias || []; SH.limites = d.limites || SH.limites;
    if (!SH.cats.length) nkToast("A Shopee não sugeriu categoria para este título.", "aviso");
  } catch (e) { nkToast(e.message, "erro"); }
  SH.ocupado = ""; desenharShopee();
}
async function shEscolherCategoria(cid, nome) {
  if (!cid) return;
  if (SH.f.categoria && SH.f.categoria !== cid) SH.f.atributos = {};
  SH.f.categoria = cid; SH.f.categoria_nome = nome || cid;
  await shCarregarCategoria(cid);
}
async function shCarregarCategoria(cid) {
  SH.ocupado = "attrs"; desenharShopee();
  try {
    const d = await api(`/api/anuncios/shopee/atributos?categoria=${enc(cid)}&codigo=${enc(F.codigo)}`);
    SH.defs = d.atributos || []; SH.marcas = d.marcas || []; SH.marcaObrig = !!d.marca_obrigatoria;
    SH.marcaFicha = d.marca_da_ficha || null; SH.limites = d.limites || SH.limites;
    if (!(SH.f.marca && SH.f.marca.id) && SH.marcaFicha) SH.f.marca = {...SH.marcaFicha};
  } catch (e) { SH.defs = null; nkToast(e.message, "erro"); }
  SH.ocupado = ""; desenharShopee();
}
function shPedirConta() {
  clearTimeout(shContaTimer);
  shContaTimer = setTimeout(async () => {
    if (!SH.f) return;
    const p = numBr(SH.f.preco);
    try { SH.conta = await api(`/api/anuncios/shopee/conta?codigo=${enc(F.codigo)}&preco=${p == null ? "" : enc(p)}`); }
    catch (e) { SH.conta = {erro: e.message}; }
    desenharShopee();
  }, 400);
}
function shAttr(id, campo, valor) {
  const a = SH.f.atributos[id] = SH.f.atributos[id] || {};
  a[campo] = valor;
  if (!a.valor && !a.valor_id) delete SH.f.atributos[id];
}
function shMarca(texto) {
  const t = String(texto || "").trim().toLowerCase();
  if (!t) { SH.f.marca = {}; return; }
  if (t === "no brand" || t === "sem marca") { SH.f.marca = {id: "0", nome: "No Brand"}; return; }
  const m = (SH.marcas || []).find(x => String(x.nome).toLowerCase() === t || String(x.original).toLowerCase() === t);
  SH.f.marca = m ? {id: m.id, nome: m.original || m.nome} : {};
}
function shFoto(id, on) {
  const s = SH.f.fotos;
  if (on && !s.includes(id)) { if (s.length >= 9) { nkToast("A Shopee aceita até 9 fotos.", "aviso"); desenharShopee(); return; } s.push(id); }
  if (!on) SH.f.fotos = s.filter(x => x !== id);
  desenharShopee();
}
function shCorpo() {
  const f = SH.f;
  return {titulo: f.titulo, categoria: f.categoria, categoria_nome: f.categoria_nome, descricao: f.descricao,
    preco: f.preco, quantidade: f.quantidade, atributos: f.atributos, marca: f.marca, fotos: f.fotos};
}
async function shSalvar(silencioso) {
  if (!PODE || !SH.f) return null;
  const corpo = SH.r ? {id: SH.r.id, versao: SH.r.versao, ...shCorpo()} : {codigo: F.codigo, ...shCorpo()};
  SH.ocupado = "salvar"; desenharShopee();
  try {
    const d = await api("/api/anuncios/shopee/rascunho", corpo);
    SH.r = d.rascunho; SH.f = shForm(d.rascunho);
    const i = (SH.lista || []).findIndex(x => x.id === SH.r.id);
    if (i >= 0) SH.lista[i] = SH.r; else (SH.lista = SH.lista || []).unshift(SH.r);
    if (!silencioso) nkToast("Rascunho da Shopee salvo.", "ok");
    return SH.r;
  } catch (e) {
    nkToast(e.status === 409 ? "Outra pessoa alterou este rascunho: recarregue a ficha." : e.message, "erro");
    return null;
  } finally { SH.ocupado = ""; desenharShopee(); }
}
async function shConferir() {
  const r = await shSalvar(true); if (!r) return;
  SH.ocupado = "conferir"; desenharShopee();
  try {
    const d = await api("/api/anuncios/shopee/conferir", {id: r.id});
    SH.r = d.rascunho; SH.f = shForm(d.rascunho);
    nkToast(d.ok ? "Conferido: pode publicar na Shopee." : "Há o que acertar antes de publicar.", d.ok ? "ok" : "aviso");
    (d.avisos || []).forEach(a => nkToast(a, "aviso", {duracao: 12000}));  // revisão: ex. marca vai como "No Brand"
  } catch (e) { nkToast(e.message, "erro"); }
  SH.ocupado = ""; carregarShopee(true);
}
async function shPublicar() {
  const r = SH.r; if (!PODE || !r || r.situacao !== "validado") return;
  if (!await nkConfirmar(`Publicar na Shopee?\n${r.titulo}\nR$ ${String(r.preco).replace(".", ",")} · ${r.quantidade} un. · ${(r.fotos || []).length} foto(s).\nIsto cria o anúncio de verdade na loja de Araçatuba. O Apollo é lido de novo na hora.`, {ok: "Publicar na Shopee", perigo: false})) return;
  SH.ocupado = "publicar"; desenharShopee();
  try {
    // revisão: o servidor publica em segundo plano (fotos + criação passavam dos 60 s); a tela acompanha o rascunho
    await api("/api/anuncios/shopee/publicar", {id: r.id});
    const cod = F.codigo, limite = Date.now() + 5 * 60 * 1000;
    let atual = null;
    while (Date.now() < limite) {
      await new Promise(ok => setTimeout(ok, 2000));
      if (!F || F.codigo !== cod) { SH.ocupado = ""; return; }  // 2ª revisão: outra ficha aberta não fica travada
      try { atual = ((await api(`/api/anuncios/shopee/rascunhos?codigo=${enc(cod)}`)).rascunhos || []).find(x => x.id === r.id); }
      catch (_) { atual = null; }
      if (atual && atual.situacao !== "publicando") break;
    }
    if (atual) { SH.r = atual; SH.f = shForm(atual); }
    if (atual && atual.situacao === "publicado") { nkToast(`Anúncio criado na Shopee: item ${atual.item_id}. Ele já aparece na lista com estoque em Manual.`, "ok", {duracao: 12000}); recarregar(); }
    else if (atual && atual.situacao !== "publicando") nkToast((atual.erros || [])[0] || "Não publicado.", "erro", {duracao: 12000});
    else nkToast("A publicação ainda está em andamento. Atualize a ficha em instantes para ver o resultado.", "aviso", {duracao: 12000});
  } catch (e) { nkToast(e.status === 409 ? "Outra publicação em andamento: aguarde." : e.message, "erro"); }
  SH.ocupado = ""; carregarShopee(true);
}
async function shLiberar() {
  const r = SH.r; if (!PODE || !r) return;
  const item = String(($("shItemIncerto") || {}).value || "").trim();
  if (!await nkConfirmar(item ? `Marcar o rascunho como publicado com o item ${item}?` : "Liberar sem número? Use só se conferiu no Seller Center que o anúncio NÃO foi criado.", {ok: "Liberar", perigo: !item})) return;
  try {
    const d = await api("/api/anuncios/shopee/liberar", {id: r.id, item_id: item});
    SH.r = d.rascunho; SH.f = shForm(d.rascunho);
    nkToast(item ? "Rascunho marcado como publicado." : "Liberado: pode conferir e publicar de novo.", "ok");
    if (item) recarregar();
  } catch (e) { nkToast(e.message, "erro"); }
  carregarShopee(true);
}

function shCartoesPreco() {
  const c = SH.conta;
  if (!c) return '<p class="muted">Calculando…</p>';
  if (c.erro) return `<div class="nk-aviso bad">${esc(c.erro)}</div>`;
  const cart = (t, v, s) => `<div class="nk-kpi"><span>${t}</span><b>${v}</b><small>${s}</small></div>`;
  return `<div class="g3">${[
    cart("Tarifa da Shopee", brl(c.comissao), c.comissao_pct == null ? "—" : `${pct(c.comissao_pct)} + ${brl(c.taxa_fixa)} por venda`),
    cart("Imposto", brl(c.imposto_valor), pct(c.imposto) + " da venda"),
    cart("Custo", brl(c.custo), esc(c.custo_origem || "")),
    cart("Lucro", brl(c.lucro), c.margem == null ? "sem custo, sem lucro" : "margem " + pct(c.margem)),
    cart("Preço ideal", brl(c.preco_ideal), c.margem_alvo == null ? "precisa da margem-alvo" : "margem-alvo " + pct(c.margem_alvo)
      + (c.preco_ideal && PODE && shEditavel() ? ` <button type="button" class="nk-btn mini" onclick="SH.f.preco='${String(c.preco_ideal).replace(".", ",")}';shPedirConta();desenharShopee()">Usar o ideal</button>` : ""))].join("")}</div>
    <p class="muted">O frete da Shopee não entra na conta (vem do programa de frete da loja).</p>`;
}
function shAtributosHtml() {
  if (!SH.f.categoria) return '<p class="muted">Escolha a categoria primeiro.</p>';
  if (SH.ocupado === "attrs") return '<p class="muted">Lendo os atributos da categoria na Shopee…</p>';
  if (!SH.defs) return `<p class="muted">Atributos não lidos. <button type="button" class="nk-btn mini" onclick="shCarregarCategoria(SH.f.categoria)">Ler de novo</button></p>`;
  const dis = PODE && shEditavel() ? "" : "disabled";
  const campo = a => {
    const v = SH.f.atributos[a.id] || {};
    const falta = a.obrigatorio && !(v.valor || v.valor_id);
    let ctl;
    if (a.tipo === "lista" || a.tipo === "multi") {
      ctl = `<select ${dis} data-id="${esc(a.id)}" onchange="shAttr(this.dataset.id,'valor_id',this.value);desenharShopee()"><option value="">—</option>${a.valores.map(x => `<option value="${esc(x.id)}" ${String(v.valor_id) === String(x.id) ? "selected" : ""}>${esc(x.nome)}</option>`).join("")}</select>`;
    } else {
      const lista = a.valores.length ? `list="shl${esc(a.id)}"` : "";
      ctl = `<input ${dis} ${lista} data-id="${esc(a.id)}" value="${esc(v.valor_id ? ((a.valores.find(x => String(x.id) === String(v.valor_id)) || {}).nome || "") : (v.valor || ""))}" oninput="const m=(SH.defs.find(d=>d.id===this.dataset.id)||{valores:[]}).valores.find(x=>x.nome===this.value);shAttr(this.dataset.id,'valor_id',m?m.id:'');shAttr(this.dataset.id,'valor',m?'':this.value)">`
        + (a.valores.length ? `<datalist id="shl${esc(a.id)}">${a.valores.map(x => `<option value="${esc(x.nome)}">`).join("")}</datalist>` : "")
        + (a.unidades.length ? `<select ${dis} data-id="${esc(a.id)}" onchange="shAttr(this.dataset.id,'unidade',this.value)"><option value="">unidade</option>${a.unidades.map(u => `<option ${v.unidade === u ? "selected" : ""}>${esc(u)}</option>`).join("")}</select>` : "");
    }
    return `<label class="nk-campo ${falta ? "falta" : ""}"><span>${esc(a.nome)} ${a.obrigatorio ? '<span class="orig bad">obrigatório</span>' : ""}</span>${ctl}</label>`;
  };
  const obrig = SH.defs.filter(a => a.obrigatorio), outros = SH.defs.filter(a => !a.obrigatorio);
  const marca = SH.f.marca && SH.f.marca.id ? SH.f.marca.nome : "";
  return `<div class="g2">${obrig.map(campo).join("") || '<p class="muted">Esta categoria não tem atributo obrigatório.</p>'}</div>
    <label class="nk-campo ${SH.marcaObrig && !marca ? "falta" : ""}"><span>Marca na Shopee ${SH.marcaObrig ? '<span class="orig bad">obrigatório</span>' : '<span class="muted">(sem marca na lista = "No Brand")</span>'}${SH.marcaFicha && marca === SH.marcaFicha.nome ? ' <span class="orig">da ficha</span>' : ""}</span>
      <input ${dis} list="shMarcas" value="${esc(marca)}" placeholder="Digite e escolha da lista" onchange="shMarca(this.value);desenharShopee()">
      <datalist id="shMarcas">${(SH.marcas || []).slice(0, 3000).map(m => `<option value="${esc(m.original || m.nome)}">`).join("")}${SH.marcaObrig ? "" : '<option value="No Brand">'}</datalist></label>
    ${outros.length ? `<details class="rem"><summary>Outros atributos (opcionais, ${outros.length})</summary><div class="g2">${outros.map(campo).join("")}</div></details>` : ""}`;
}
function desenharShopee() {
  const el = $("secShopee"); if (!el) return;
  // V20.56 (dono, 11/11): os painéis de criar anúncio ficam sempre juntos, com qualquer casa no seletor
  if (!F) { el.hidden = true; el.innerHTML = ""; return; }
  el.hidden = false;
  const lista = SH.lista;
  const linha = r => { const s = SH_SIT[r.situacao] || [r.situacao, ""];
    return `<tr${SH.r && SH.r.id === r.id ? ' class="atual"' : ""}><td>${r.titulo ? esc(r.titulo) : '<span class="muted">sem título</span>'}</td><td class="n">${brl(r.preco)}</td><td class="n">${esc(r.quantidade ?? "—")}</td>
      <td><span class="nk-selo ${s[1]}">${esc(s[0])}</span> ${r.item_id ? `<span class="mono">item ${esc(r.item_id)}</span>` : ""}</td><td>${quando(r.atualizado_em)}${r.atualizado_por ? " · " + esc(r.atualizado_por) : ""}</td>
      <td>${PODE ? `<button type="button" class="nk-btn mini" onclick="abrirShopee(${Number(r.id)})">${EDITAVEL.includes(r.situacao) ? "Continuar" : "Ver"}</button>` : ""}</td></tr>`; };
  let form = "";
  if (SH.f) {
    const f = SH.f, r = SH.r, dis = PODE && shEditavel() ? "" : "disabled", oc = SH.ocupado ? "disabled" : "";
    const lim = SH.limites || {}, tmax = lim.titulo_max || 120;
    const campos = (F.ficha && F.ficha.campos) || {};
    const medida = (n, u) => campos[n] ? `${esc(campos[n])} ${u}` : '<span class="bad">falta</span>';
    const s = r ? SH_SIT[r.situacao] || [r.situacao, ""] : null;
    const erros = r && (r.erros || []).length ? `<div class="nk-aviso ${r.situacao === "publicado" ? "info" : "bad"}"><b>${r.situacao === "erro" ? "A Shopee recusou:" : "O que precisa ser acertado:"}</b><ul>${r.erros.map(e => `<li>${esc(e)}</li>`).join("")}</ul></div>` : "";
    form = `<div class="nk-painel-tit" style="margin-top:14px"><div><h3>${r ? `Rascunho Shopee nº ${esc(r.id)} <span class="nk-selo ${s[1]}">${esc(s[0])}</span>` : "Novo anúncio na Shopee"}</h3>
        <p class="muted">${r ? `versão ${esc(r.versao)} · ${quando(r.atualizado_em)}${r.atualizado_por ? " por " + esc(r.atualizado_por) : ""}` : "Loja de Araçatuba."}</p></div>
        <button type="button" class="nk-btn mini" onclick="fecharShopee()">Fechar</button></div>
      ${erros}
      <section class="passo"><h3><span class="num">1</span>Título</h3>
        <label class="nk-campo"><span>Título na Shopee <span class="muted">${f.titulo.length} de ${tmax} caracteres</span></span>
          <input ${dis} maxlength="255" value="${esc(f.titulo)}" oninput="SH.f.titulo=this.value;this.previousElementSibling.querySelector('.muted').textContent=this.value.length+' de ${tmax} caracteres'"></label></section>
      <section class="passo"><h3><span class="num">2</span>Categoria</h3>
        ${f.categoria ? `<p>Escolhida: <b>${esc(f.categoria_nome || f.categoria)}</b> <span class="muted mono">${esc(f.categoria)}</span></p>` : ""}
        ${PODE && shEditavel() ? `<div class="barra"><button type="button" class="nk-btn mini" ${oc} onclick="shSugerir()">${SH.ocupado === "cats" ? "Consultando…" : "Sugerir pela Shopee (pelo título)"}</button>
          <input id="shCatManual" placeholder="ou o número da categoria" style="max-width:220px"><button type="button" class="nk-btn mini" onclick="shEscolherCategoria(String($('shCatManual').value).trim(),'')">Usar</button></div>` : ""}
        ${SH.cats ? `<div class="g1">${SH.cats.map(c => `<label style="display:flex;gap:8px;align-items:center;margin:6px 0;cursor:pointer"><input type="radio" name="shcat" ${dis} ${c.folha ? "" : "disabled"} ${f.categoria === c.categoria ? "checked" : ""} data-id="${esc(c.categoria)}" data-nome="${esc(c.caminho || c.nome)}" onchange="shEscolherCategoria(this.dataset.id,this.dataset.nome)"> ${esc(c.caminho || c.nome)} ${c.folha ? "" : '<span class="muted">(tem subcategorias)</span>'}</label>`).join("") || '<p class="muted">Nenhuma sugestão.</p>'}</div>` : ""}</section>
      <section class="passo"><h3><span class="num">3</span>Atributos e marca</h3>${shAtributosHtml()}</section>
      <section class="passo"><h3><span class="num">4</span>Fotos <span class="muted">(${f.fotos.length} de até ${lim.fotos_max || 9})</span></h3>
        ${(F.fotos || []).length ? `<div class="fotos-sel">${(F.fotos || []).map(x => `<label style="display:inline-flex;gap:6px;align-items:center;margin:4px 10px 4px 0;cursor:pointer"><input type="checkbox" ${dis} ${f.fotos.includes(x.id) ? "checked" : ""} data-id="${x.id}" onchange="shFoto(Number(this.dataset.id),this.checked)"><img src="${urlFoto(x.id)}" alt="" style="width:56px;height:56px;object-fit:contain;border:1px solid var(--nk-line);border-radius:6px;background:#fff"></label>`).join("")}</div><p class="muted">A Shopee aceita JPG e PNG.</p>` : '<p class="muted">A ficha não tem fotos: suba na aba Fotos.</p>'}</section>
      <section class="passo"><h3><span class="num">5</span>Descrição, preço, quantidade e envio</h3>
        <label class="nk-campo"><span>Descrição</span><textarea ${dis} rows="8" oninput="SH.f.descricao=this.value">${esc(f.descricao)}</textarea></label>
        <div class="g2"><label class="nk-campo"><span>Preço (R$)</span><input ${dis} value="${esc(f.preco)}" inputmode="decimal" oninput="SH.f.preco=this.value;shPedirConta()"></label>
          <label class="nk-campo"><span>Quantidade <span class="muted">(no Publicar não pode passar do que dá para montar no Apollo de Araçatuba)</span></span><input ${dis} value="${esc(f.quantidade)}" inputmode="numeric" oninput="SH.f.quantidade=this.value"></label></div>
        ${shCartoesPreco()}

// --- V20.34: criar anúncio na Magalu (Araçatuba). A Magalu responde "recebido" (202) e cria depois: o Noromak lê o SKU
// (o código da ficha) até ele aparecer e então manda o preço e o estoque. As fotos vêm do anúncio do ML deste produto
// (endereços públicos do mlstatic, JPEG): a Magalu baixa a foto pelo endereço e as do Noromak ficam atrás do login.
const MG_SIT = {rascunho: ["Rascunho", ""], validado: ["Conferido", "info"], publicando: ["Enviando…", "warn"],
  aguardando: ["Aguardando a Magalu", "warn"], publicado: ["Publicado", "ok"], erro: ["Recusado pela Magalu", "bad"],
  incerto: ["Confira no painel da Magalu", "bad"]};
let MG = {codigo: null, lista: null, erro: "", r: null, f: null, cats: null, defs: null, fotosMl: null, conta: null, ocupado: ""};
let mgContaTimer = null;
const mgEditavel = () => !MG.r || EDITAVEL.includes(MG.r.situacao);

async function carregarMagalu(forcar) {
  if (!F || F.naoExiste) { MG.lista = []; desenharMagalu(); return; }
  const cod = F.codigo;
  if (!forcar && MG.codigo === cod && MG.lista) { desenharMagalu(); return; }
  try {
    const d = await api(`/api/anuncios/magalu/rascunhos?codigo=${enc(cod)}`);
    if (!F || F.codigo !== cod) return;
    if (MG.codigo !== cod) MG = {...MG, r: null, f: null, cats: null, defs: null, fotosMl: null, conta: null};
    MG.codigo = cod; MG.lista = d.rascunhos || []; MG.erro = "";
  } catch (e) { MG.lista = null; MG.erro = e.message; }
  desenharMagalu();
}
function mgForm(r) {
  const campos = (F.ficha && F.ficha.campos) || {};

  return r ? {titulo: r.titulo || "", categoria: r.categoria || "", categoria_nome: r.categoria_nome || "", marca: r.marca || "",
      descricao: r.descricao || "", preco: brl2(r.preco), preco_de: brl2(r.preco_de), quantidade: r.quantidade == null ? "" : String(r.quantidade),
      atributos: {...(r.atributos || {})}, ficha_tecnica: {...(r.ficha_tecnica || {})}, fotos: [...(r.fotos || [])],
      comissao: MG.f ? MG.f.comissao : "", taxa_fixa: MG.f ? MG.f.taxa_fixa : "", frete: MG.f ? MG.f.frete : ""}
    : {titulo: String(campos.nome || "").replace(/\s+/g, " ").trim().slice(0, 150), categoria: "", categoria_nome: "",
      marca: String(campos.marca || ""), descricao: String(campos.descricao || ""), preco: "", preco_de: "", quantidade: "",
      atributos: {}, ficha_tecnica: {}, fotos: [], comissao: "", taxa_fixa: "", frete: ""};
}
function novoMagalu() { MG.r = null; MG.f = mgForm(null); MG.cats = null; MG.defs = null; MG.conta = null; desenharMagalu(); mgTrazerFotos(true); mgPedirConta(); }
async function abrirMagalu(id) {
  const r = (MG.lista || []).find(x => x.id === id); if (!r) return;
  MG.r = r; MG.f = mgForm(r); MG.cats = null; MG.conta = null;
  desenharMagalu();
  if (r.categoria) await mgCarregarCategoria(r.categoria);

  if (r.situacao === "aguardando") mgAcompanhar();
}
function fecharMagalu() { MG.r = null; MG.f = null; desenharMagalu(); }

async function mgTrazerFotos(silencioso) {
  MG.ocupado = "fotos"; desenharMagalu();
  try {
    const d = await api(`/api/anuncios/magalu/fotos?codigo=${enc(F.codigo)}`);
    MG.fotosMl = d.fotos || [];
    if (MG.f && !MG.f.fotos.length) MG.f.fotos = MG.fotosMl.map(x => x.url);
    if (!MG.fotosMl.length && !silencioso) nkToast("Este produto não tem anúncio no ML com fotos: publique no ML primeiro (a Magalu precisa de foto com endereço público).", "aviso", {duracao: 12000});
  } catch (e) { MG.fotosMl = []; if (!silencioso) nkToast(e.message, "erro"); }

async function mgBuscarCategoria() {
  const nome = String(($("mgCatBusca") || {}).value || "").trim();
  if (nome.length < 3) { nkToast("Digite pelo menos 3 letras do nome da categoria (ex.: limpeza, ferramentas).", "aviso"); return; }

    MG.cats = (await api(`/api/anuncios/magalu/categorias?nome=${enc(nome)}`)).categorias || [];
    if (!MG.cats.length) nkToast("A Magalu não achou categoria com esse nome.", "aviso");

async function mgEscolherCategoria(cid, nome) {
  if (!cid) return;
  if (MG.f.categoria && MG.f.categoria !== cid) { MG.f.atributos = {}; MG.f.ficha_tecnica = {}; }
  MG.f.categoria = cid; MG.f.categoria_nome = nome || cid;

}
async function mgCarregarCategoria(cid) {
  MG.ocupado = "attrs"; desenharMagalu();
  try {
    MG.defs = await api(`/api/anuncios/magalu/atributos?categoria=${enc(cid)}`);
    const campos = (F.ficha && F.ficha.campos) || {};
    (MG.defs.ficha_tecnica || []).forEach(d => {  // o que a ficha já tem entra preenchido (o Admin confere)
      const n = String(d.nome).toLowerCase();
      if (MG.f.ficha_tecnica[d.nome]) return;
      if (n === "marca" || n === "fabricante") { if (campos.marca) MG.f.ficha_tecnica[d.nome] = String(campos.marca); }
      else if (n === "modelo" && campos.modelo) MG.f.ficha_tecnica[d.nome] = String(campos.modelo);
    });
  } catch (e) { MG.defs = null; nkToast(e.message, "erro"); }

}
function mgPedirConta() {
  clearTimeout(mgContaTimer);
  mgContaTimer = setTimeout(async () => {
    if (!MG.f) return;
    const n = v => { const x = numBr(v); return x == null ? "" : enc(x); };
    try { MG.conta = await api(`/api/anuncios/magalu/conta?codigo=${enc(F.codigo)}&preco=${n(MG.f.preco)}&comissao=${n(MG.f.comissao)}&taxa_fixa=${n(MG.f.taxa_fixa)}&frete=${n(MG.f.frete)}`); }
    catch (e) { MG.conta = {erro: e.message}; }
    if (MG.conta && !MG.conta.erro && MG.f.comissao === "" && MG.conta.comissao_pct != null)

function mgPar(grupo, nome, valor) {

}
function mgFoto(url, on) {
  const s = MG.f.fotos;

function mgCorpo() {
  const f = MG.f;

function mgGuardarRascunho(r) {

async function mgSalvar(silencioso) {

async function mgPublicar() {
  const r = MG.r; if (!PODE || !r || r.situacao !== "validado") return;
  if (!await nkConfirmar(`Publicar na Magalu?\n${r.titulo}\nR$ ${String(r.preco).replace(".", ",")} · ${r.quantidade} un. · ${(r.fotos || []).length} foto(s).\nIsto cria o produto de verdade na loja de Araçatuba (SKU ${F.codigo}). O Apollo é lido de novo na hora.`, {ok: "Publicar na Magalu", perigo: false})) return;

let mgAcompanhando = 0;

async function carregarTiktok(forcar) {

    TT.codigo = cod; TT.lista = d.rascunhos || []; TT.fonte = d.fonte || ""; TT.erro = "";

}

      quantidade: r.quantidade == null ? "" : String(r.quantidade), atributos: JSON.parse(JSON.stringify(r.atributos || {})),

async function ttPublicar() {
  const r = TT.r; if (!PODE || !r || r.situacao !== "validado") return;
  if (!await nkConfirmar(`Publicar no TikTok?\n${r.titulo}\nR$ ${String(r.preco).replace(".", ",")} · ${r.quantidade} un. · ${(r.fotos || []).length} foto(s).\nIsto cria o anúncio de verdade na loja de Bauru. O Apollo de Bauru é lido de novo na hora.`, {ok: "Publicar no TikTok", perigo: false})) return;
  TT.ocupado = "publicar"; desenharTiktok();

    const cod = F.codigo, limite = Date.now() + 5 * 60 * 1000;

function formDoRascunho(r) {

function novoCR(r) {

function crEditavel() { return !!CR && (!CR.r || EDITAVEL.includes(CR.r.situacao)); }
function obrigFaltando(atributos) {

}
// passo i concluído = o que está GRAVADO no rascunho (o digitado e não salvo não conta)
function crFeito(i) {
  const r = CR && CR.r;
  if (!r) return false;
  if (!EDITAVEL.includes(r.situacao)) return i < 6 || r.situacao === "publicado";
  if (i === 0) return !!String(r.titulo || "").trim();
  if (i === 1) return crFeito(0) && !!r.categoria;
  if (i === 2) return crFeito(1) && CR.defsCat === r.categoria && !!CR.defs && !obrigFaltando(r.atributos).length;
  if (i === 3) return crFeito(2) && (r.fotos || []).length > 0;
  if (i === 4) return crFeito(3) && Number(r.preco) > 0 && Number(r.quantidade) >= 1;

function crMudados() {
  if (!CR || !PODE) return [];

  const at = o => JSON.stringify(Object.entries(o || {}).filter(([k, v]) => k !== "_guardados" && String(v ?? "").trim()).map(([k, v]) => [k, String(v).trim()]).sort());
  if (f.titulo.replace(/\s+/g, " ").trim() !== g.titulo) out.push(0);
  if (CR.r.categoria && CR.defsCat === CR.r.categoria && at(f.atributos) !== at(g.atributos)) out.push(2);
  const fotosOk = f.fotos.filter(id => (F.fotos || []).some(x => x.id === id));
  if (crFeito(2) && JSON.stringify(fotosOk) !== JSON.stringify(CR.r.fotos || [])) out.push(3);
  if (crFeito(3) && (numBr(f.preco) !== (CR.r.preco ?? null) || numBr(f.quantidade) !== (CR.r.quantidade ?? null)
    || f.tipo_anuncio !== g.tipo_anuncio || f.frete_gratis !== g.frete_gratis || f.garantia.trim() !== g.garantia

  return `${r.situacao === "validado" && avisos.length ? `<div class="nk-aviso bad">Não publicado — nada foi criado no Mercado Livre:<ul class="erros">${avisos.map(e => `<li>${esc(e)}</li>`).join("")}</ul></div>` : ""}
    <p class="muted">Conta ${esc(CONTA[r.conta] || r.conta)} · ${esc(r.titulo)} · ${brl(r.preco)} · ${esc(r.quantidade)} ${F.tipo === "kit" ? "kit(s)" : "un."} · ${(r.fotos || []).length} foto(s). O Apollo é lido de novo na hora de publicar.</p>
    <div class="barra"><span class="esp"></span><button type="button" class="nk-btn pri" ${btOcupado()} onclick="publicarAnuncio()"><i class=nk-i-upload></i> Publicar no Mercado Livre</button></div>`;
}
async function publicarAnuncio() {
  if (CR.ocupado) return;
  const cr = CR, r = cr.r;
  if (crMudados().length) { nkToast("Há alteração não salva: salve e confira no ML antes de publicar.", "aviso"); return; }
  const ok = await nkConfirmar(`Publicar o anúncio no Mercado Livre?\nConta: ${CONTA[r.conta] || r.conta}\nTítulo: ${r.titulo}\nPreço: ${brl(r.preco)}\nQuantidade: ${r.quantidade}\nFotos: ${(r.fotos || []).length}\n\nO anúncio é criado agora no ML. Se o ML não responder, nada é repetido sozinho.`, {ok: "Publicar", perigo: false});
  if (!ok || CR !== cr || cr.ocupado) return;
  cr.ocupado = "Publicando no Mercado Livre… subindo as fotos e criando o anúncio (pode levar alguns minutos). Não feche esta tela.";
  cr.aviso = ""; desenharCriar();
  let d;
  try { d = await api("/api/anuncios/rascunho/publicar", {id: r.id}); }
  catch (e) {
    cr.ocupado = "";
    // V20.24: erro de rede, timeout ou 504 do nginx (o servidor pode estar terminando): NUNCA tentar de novo.
    // Relê o rascunho e mostra a situação real. 400/409 = nada foi feito agora, mas a situação também é relida.
    const semResposta = !e.status || e.status >= 500;
    if (!semResposta) nkToast(e.message, e.status === 409 ? "aviso" : "erro", {duracao: 10000});
    await relerRascunhoDepoisDoPublicar(r.id, semResposta);
    return;
  }
  cr.ocupado = "";
  cr.r = d.rascunho || cr.r;
  atualizarRascNaLista(cr.r);
  if (d.situacao === "publicado") { nkToast(`Anúncio ${d.mlb} criado no Mercado Livre.`, "ok", {duracao: 12000}); await recarregarAposPublicar(); return; }
  if (d.situacao === "incerto") nkToast("O Mercado Livre não respondeu: confira se o anúncio foi criado.", "erro", {duracao: 15000});
  else nkToast((d.erros || [])[0] || "Não publicado.", "erro", {duracao: 12000});
  if (CR === cr) desenharRascunhos();
}
async function relerRascunhoDepoisDoPublicar(id, semResposta) {
  const cr = CR, cod = F.codigo;
  try {
    const d = await api(`/api/anuncios/rascunhos?codigo=${enc(cod)}`);
    if (!F || F.codigo !== cod) return;
    RASC = {codigo: cod, lista: d.rascunhos || [], erro: ""};
    const r = RASC.lista.find(x => x.id === id);
    if (cr && CR === cr && r) {
      cr.r = r;
      cr.aviso = semResposta ? `A resposta do Publicar não chegou à tela. Situação lida agora: ${(SIT[r.situacao] || [r.situacao])[0]}.`
        + (r.situacao === "publicando" ? " Ainda publicando: espere e clique em “Atualizar situação”." : "") : "";
    }
    if (r && r.situacao === "publicado") { await recarregarAposPublicar(); return; }
  } catch (e2) {
    if (cr && CR === cr) {
      cr.aviso = "A resposta do Publicar não chegou e não consegui reler o rascunho. Não publique de novo: clique em “Atualizar situação” em instantes.";
      if (cr.r && EDITAVEL.includes(cr.r.situacao)) cr.r = {...cr.r, situacao: "publicando"};  // só na tela: trava o botão até reler
    }
  }
  if (ABA === "anuncios") desenharRascunhos();
}
async function recarregarAposPublicar() {
  // a linha nova aparece em "Anúncios em todos os canais" (controle Noromak); o painel e os rascunhos ficam
  await abrirFicha(F.codigo, {manter: true});
  await carregarRascunhos(true);
}
async function liberarIncerto(achou) {
  if (CR.ocupado) return;
  const cr = CR;
  let mlb = "";
  if (achou) {
    mlb = (await nkPerguntar("Qual é o MLB do anúncio criado?", {detalhe: "Confira em Meus anúncios no Mercado Livre. Ex.: MLB1234567890", placeholder: "MLB…", obrigatorio: true,
      validar: v => /^(MLB)?\d{6,15}$/i.test(v.replace(/[\s-]/g, "")) ? "" : "MLB inválido (ex.: MLB1234567890)."}) || "").replace(/[\s-]/g, "");
    if (!mlb) return;
  } else if (!await nkConfirmar("Confirmar que o anúncio NÃO foi criado no Mercado Livre?\nVocê conferiu em Meus anúncios e ele não existe. O rascunho volta a “Conferido no ML” e pode ser publicado de novo — se o anúncio existir, ficarão dois.", {ok: "Não foi criado", perigo: true})) return;
  if (CR !== cr) return;
  try {
    const d = await api("/api/anuncios/rascunho/liberar", {id: cr.r.id, mlb});
    cr.r = d.rascunho; cr.aviso = "";
    atualizarRascNaLista(cr.r);
    nkToast(d.situacao === "publicado" ? `Rascunho ligado ao ${d.mlb}.` : "Rascunho liberado: pode publicar de novo.", "ok");
    if (d.situacao === "publicado") { await recarregarAposPublicar(); return; }
  } catch (e) { nkToast(e.message, "erro", {duracao: 9000}); }
  if (CR === cr) desenharRascunhos();
}

    EU = s.user || null;
  } catch (_) { EU = null; }
  // V20.23: gravar = só perfil Admin; Supervisor (módulo admin) e Consulta só veem
  PODE = !!EU && EU.app_role === "admin" && !EU.somente_leitura;
  rota();

})();
